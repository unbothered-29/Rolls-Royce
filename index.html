<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolls-Royce</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="shortcut icon"
        href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTF1bcZAHkB4Rrjf2o-PGO7mtz08t9hihbSAQ&s"
        type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pg1">
        <!-- Fullscreen Brightcove video (iframe) -->
        <div class="video-bg">
            <iframe
                src="https://players.brightcove.net/1634657725001/3Ev5jVtXB_default/index.html?videoId=6391131221112&autoplay=true&muted=true&controls=false&loop=true"
                allowfullscreen allow="autoplay; fullscreen">
            </iframe>
        </div>

        <!-- Dark overlay -->
        <div class="overlay"></div>

        <!-- Slide dots -->
        <div class="slide-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- Page layout -->
        <div class="page">

            <!-- Navbar -->
            <nav>
                <div class="nav-left">
                    <div class="hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    Menu
                </div>

                <!-- RR Monogram -->
                <div class="logo">
                    <img src="https://i.ibb.co/sJ588VbL/c188449046209b74ff571913e2f6387b-Photoroom.png" alt="">
                </div>
                <div class="nav-right">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="7" />
                        <line x1="16.5" y1="16.5" x2="22" y2="22" />
                    </svg>
                    Find a Dealer
                </div>
            </nav>

            <!-- Divider line -->
            <div class="divider"></div>

            <!-- Hero content -->
            <div class="hero">
                <p class="hero-sub">Project</p>
                <h1 class="hero-title">Nightingale</h1>
                <p class="hero-collection">A Coachbuild Collection</p>
                <button class="btn-discover">Discover More</button>
            </div>

        </div>
    </div>
    <div class="pg2">
        <!-- Fullscreen video background -->
        <div class="video-bg2">
            <iframe
                src="https://players.brightcove.net/1634657725001/3Ev5jVtXB_default/index.html?videoId=6391132985112&autoplay=true&muted=true&controls=false&loop=true"
                allowfullscreen allow="autoplay; fullscreen">

        <div class="overlay2"></div>

        <!-- Slide dots -->
        <div class="slide-dots2">
            <div class="dot2"></div>
            <div class="dot2 active2"></div>
            <div class="dot2"></div>
        </div>

        <!-- Page layout -->
        <div class="page2">

            <!-- Navbar -->
            <nav>
                <div class="nav-left2">
                    <div class="hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

                    </svg>

                </div>
            </nav>
            <!-- Hero content -->
            <div class="hero2">
                <h1 class="hero2-title">Coachbuild Collection</h1>
                <button class="btn-discover">Discover Now</button>
            </div>

        </div>
    </div>

        <!-- Fullscreen image background -->
        <img src="https://i.ibb.co/QFmGP4gj/Untitled-design-1.png" alt="">

        <!-- Dark overlay -->

                        <line x1="16.5" y1="16.5" x2="22" y2="22" />
                    </svg>

                </div>
            </nav>
            <!-- Hero content -->
            <div class="hero2">
