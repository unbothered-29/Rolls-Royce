<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolls-Royce</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="shortcut icon"
        href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTF1bcZAHkB4Rrjf2o-PGO7mtz08t9hihbSAQ&s"
        type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fullscreen Brightcove video (iframe) -->
    <div class="video-bg">
        <iframe
            src="https://players.brightcove.net/1634657725001/3Ev5jVtXB_default/index.html?videoId=6391132493112&autoplay=true&muted=true&controls=false&loop=true"
            allowfullscreen allow="autoplay; fullscreen">
        </iframe>
    </div>

    <!-- Dark overlay -->
    <div class="overlay"></div>

    <!-- Slide dots -->
    <div class="slide-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <!-- Page layout -->
    <div class="page">

        <!-- Navbar -->
        <nav>
            <div class="nav-left">
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                Menu
            </div>

            <!-- RR Monogram -->
            <div class="logo">
                <svg width="52" height="60" viewBox="0 0 52 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Outer rectangle frame -->
                    <rect x="1" y="1" width="50" height="58" stroke="white" stroke-width="0.8" />
                    <!-- R letterforms (simplified RR monogram) -->
                    <text x="26" y="42" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="34"
                        font-weight="400" fill="white" letter-spacing="-2">RR</text>
                </svg>
            </div>

            <div class="nav-right">
                <!-- Search icon -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="11" cy="11" r="7" />
                    <line x1="16.5" y1="16.5" x2="22" y2="22" />
                </svg>
                Find a Dealer
            </div>
        </nav>

        <!-- Divider line -->
        <div class="divider"></div>

        <!-- Hero content -->
        <div class="hero">
            <p class="hero-sub">Project</p>
            <h1 class="hero-title">Nightingale</h1>
            <p class="hero-collection">A Coachbuild Collection</p>
            <button class="btn-discover">Discover More</button>
        </div>

    </div>
</body>

</html>
